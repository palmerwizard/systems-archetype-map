<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Term Constellations</title>
<style>
  :root{ color-scheme:dark; --bg:#04060c; --panel:#0b0f1a; --line:#1c2436; --ink:#e8ecf4; --dim:#97a0b5; --accent:#7dd3fc; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; font-size:14px;}
  #app{display:flex; flex-direction:column; height:100%;}
  header{padding:12px 20px 10px; border-bottom:1px solid var(--line); position:relative;}
  header h1{display:flex; align-items:center; gap:12px; flex-wrap:wrap;} header h1 .chip{font-weight:400;}
  #intro{position:absolute; z-index:30; left:16px; right:16px; top:calc(100% + 6px); max-width:760px; max-height:70vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 12px 40px #000a;}
  #intro .sub{color:var(--ink); font-size:13.5px; font-weight:600;} #intro p{color:var(--dim); font-size:12.5px; margin-top:6px; line-height:1.55;} #intro p b{color:var(--ink);}
  .csub{opacity:0; transition:opacity .15s;} .cg.hov .csub{opacity:1;}
  header h1{font-size:19px; font-weight:650;} header h1 .sub{color:var(--dim); font-weight:400; font-size:13px; margin-left:8px;}
  header p{color:var(--dim); font-size:12.5px; margin-top:5px; max-width:1100px; line-height:1.5;} header p b{color:var(--ink);}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:9px 20px; border-bottom:1px solid var(--line); background:var(--panel);}
  input.search,select.search{background:#0a0e18; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 12px; font-size:13px; outline:none;}
  input.search{width:220px;} input.search:focus{border-color:var(--accent);}
  .chip{border:1px solid var(--line); background:#0d1220; color:var(--ink); border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; user-select:none; white-space:nowrap;}
  .chip .dot{width:9px; height:9px; border-radius:50%; display:inline-block;} .chip.off{opacity:.38; color:var(--dim);}
  .sep{width:1px; height:20px; background:var(--line);}
  #main{flex:1 1 auto; display:flex; min-height:0;}
  #stage{flex:1 1 auto; position:relative; min-width:0; background:radial-gradient(ellipse at 50% 45%, #0c1430 0%, #070b1c 45%, #03050c 100%);}
  svg#map{position:absolute; inset:0; width:100%; height:100%; cursor:grab; user-select:none; touch-action:none;}
  svg#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; will-change:transform;}   /* the moving arrows live on their own layer, so animating them never repaints the map */
  svg text{font-family:inherit; paint-order:stroke; stroke:#04060c; stroke-width:3.5px; stroke-linejoin:round;}
  #detail{flex:0 0 350px; border-left:1px solid var(--line); background:var(--panel); padding:16px; overflow-y:auto; font-size:13px; line-height:1.5;}
  #detail h2{font-size:17px; margin-bottom:6px;}
  .desc{color:var(--dim); font-size:13px; line-height:1.55; margin:8px 0 10px;}
  .h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 6px;}
  .tier{display:inline-block; font-size:11.5px; border-radius:6px; padding:1px 8px; font-weight:600;}
  .tag{display:inline-block; font-size:11.5px; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:1px 7px; margin:0 4px 4px 0;}
  .rrow{margin-bottom:9px;} .rrow .bar{height:5px; border-radius:3px; display:inline-block; vertical-align:middle; margin-right:6px;}
  .lnk{cursor:pointer; color:var(--accent);} .lnk:hover{text-decoration:underline;}
  a{color:var(--accent); text-decoration:none;} a:hover{text-decoration:underline;}
  .dim{color:var(--dim);} .sm{font-size:12px;}
  .empty{color:var(--dim); text-align:center; margin-top:40px; line-height:1.7;}
  #legend{position:absolute; left:12px; bottom:10px; background:rgba(8,12,22,.92); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:12px; color:var(--dim); line-height:1.7; max-width:520px;}
  #zoom{position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:6px; z-index:4;}
  #zoom button{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:rgba(11,15,26,.95); color:var(--ink); font-size:20px; cursor:pointer; font-family:inherit;}
  #zoom button.t{font-size:12px;} #zoom button:hover{border-color:var(--accent); color:var(--accent);}
  .con{padding:9px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; cursor:pointer;}
  .con:hover{border-color:#fde68a;} .con b{font-size:14px;} .mix{display:inline-block; height:5px; border-radius:3px; vertical-align:middle;}
  #legend{pointer-events:none;}
  .readcard{border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:12px; background:#0d1222;}
  .readcard summary{cursor:pointer; font-size:13.5px;} .readcard .rc{font-size:12.5px; line-height:1.5; margin-top:8px;}
  @keyframes trajflow{ to{ stroke-dashoffset:-56; } }
  .trajflow{ animation:none; }
  svg.moving .gSky, svg.moving .bglow{ visibility:hidden; }
  svg.trajmode .gB, svg.trajmode .gC{ opacity:.25; transition:opacity .15s; }   /* bridges and nebulae step back while a path shows */   /* still lines: the moving dashes made the map hard to read */
  @media (prefers-reduced-motion: reduce){ .trajflow{ animation:none; } }
  svg.far .tl{display:none;}
  @media (max-height:760px), (max-width:900px){
    .toolbar{flex-wrap:nowrap; overflow-x:auto; padding:7px 12px; scrollbar-width:thin;} .toolbar > *{flex:0 0 auto;}
    #chips,#tchips,#achips,#lchips,#lcchips{display:inline-flex; gap:8px;}
    header{padding:8px 12px 0;} header h1{font-size:16px;} header h1 .sub{display:none;} #stats{font-size:11.5px; margin:3px 0 5px;}
    .tab{padding:6px 11px; font-size:12.5px;}
  }

  @media (max-height:760px){ #legend{font-size:11px; padding:6px 9px;} }
  @media (max-height:560px){ #legend{display:none;} }
  #tip{position:absolute; pointer-events:none; background:rgba(8,12,22,.96); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12px; display:none; max-width:280px; z-index:5;}
  /* phones: the details panel becomes a bottom sheet under the map instead of disappearing */
  @media (max-width:800px){
    #main{flex-direction:column;}
    #stage{flex:1 1 58%; min-height:0;}
    #detail{display:block; flex:0 0 42%; border-left:none; border-top:1px solid var(--line); padding:12px 16px; -webkit-overflow-scrolling:touch;}
    header{padding-left:16px; padding-right:16px;}
    .toolbar{padding-left:16px; padding-right:16px;}
  }
</style>
</head>

</div>

  const n=DATA.nodes[i], L=NB[i], c=CONS[n.c]; const maxS=Math.max(.01,...L.map(x=>x.e.s));
  $('detail').innerHTML='<div class="sm"><span class="lnk" id="back">&larr; '+esc(c.name)+'</span></div><h2 style="margin-top:8px">'+esc(n.term)+'</h2>'+tierTag(n.tier)+sideTag(n)+' <span class="sm" style="color:'+ccol(n.cluster)+'">&nbsp;'+esc(n.new?(n.mine?'coined term':'new word'):(n.cluster?CC[n.cluster].name:'general vocabulary'))+'</span>'+
  '<div class="desc">'+esc(n.why)+'</div>'+
  (n.placedBy==='trajectory'&&!n.orbit?'<div class="sm dim" style="margin-bottom:8px">Placed by its trajectory: its GitHub links are too thin to place it ('+(n.ghTotal==null?'?':n.ghTotal.toLocaleString())+' repos found, '+(n.inContext==null?'?':n.inContext)+' using the word in this sense).</div>':'')+
  (()=>{ const lab=s=>s.src==='rosetta'?'rosetta':s.src==='research'?'research':'proposed';
    const starts=(DATA.traj||[]).filter(tr=>tr.steps[0].i===i);
    if(starts.length) return starts.map(tr=>'<div class="sm" style="border-left:3px solid '+tr.color+';padding:4px 0 4px 9px;margin-bottom:10px"><b style="color:'+tr.color+'">'+esc(tr.name)+'</b> <span class="dim">('+esc(tr.source)+')</span>'+tr.steps.map((s,j)=>j<(tr.fork||0)?'':'<div style="margin-top:5px"><b style="color:'+tr.color+'">'+(j+1)+'</b> <span class="lnk" data-i="'+s.i+'">'+esc(DATA.nodes[s.i].term)+'</span> <span class="dim">'+lab(s)+'</span><br><span class="dim">'+esc(s.note)+'</span></div>').join('')+((tr.fork||0)>0?'<div class="dim" style="margin-top:5px">Steps 1 to '+(tr.fork+1)+' are shared with the main path.</div>':'')+'</div>').join('');
    const hits=[]; (DATA.traj||[]).forEach(tr=>tr.steps.forEach((s,k)=>{ if(s.i===i&&k>=(tr.fork||0)) hits.push({tr,k,s}); }));
    if(!hits.length) return '';
    const notes=[...new Set(hits.map(h=>h.s.note))];
    return '<div class="sm" style="border-left:3px solid #e2e8f0;padding:4px 0 4px 9px;margin-bottom:10px"><b>On the trajectories</b><br>'+hits.map(h=>'<span style="color:'+h.tr.color+'">'+esc(h.tr.name)+', step '+(h.k+1)+'</span> <span class="dim">('+lab(h.s)+')</span>').join('<br>')+notes.map(nt=>'<div class="dim" style="margin-top:4px">'+esc(nt)+'</div>').join('')+'</div>'; })()+
  (n.hingeNote?'<div class="sm" style="border-left:3px solid #fde68a;padding:4px 0 4px 9px;margin-bottom:10px"><b style="color:#fde68a">The hinge between the two prisms.</b> '+esc(n.hingeNote.replace('The hinge between the two prisms. ',''))+(n.hingeCases?n.hingeCases.map(k=>'<div style="margin-top:6px"><b>'+esc(k.who)+'</b> <span class="tag" style="color:'+(k.way==='returned'?'#34d399':'#94a3b8')+';border-color:'+(k.way==='returned'?'#34d399':'#475569')+'">'+esc(k.way)+'</span><br><span class="dim">'+esc(k.what)+'</span></div>').join(''):'')+'</div>':'')+
  (n.zeroPoint?'<div class="sm" style="border-left:3px solid #60a5fa;padding:4px 0 4px 9px;margin-bottom:10px"><span class="tier" style="background:#60a5fa22;color:#60a5fa;border:1px solid #60a5fa66">speculative</span> <span class="dim">('+esc(n.zeroPoint.by)+')</span><div style="margin-top:5px">'+esc(n.zeroPoint.claim)+'</div>'+(n.zeroPoint.grounding?'<div class="dim" style="margin-top:6px">What is documented:</div>'+n.zeroPoint.grounding.map(g=>'<div style="margin-top:4px"><b>'+esc(g.who)+'</b><br><span class="dim">'+esc(g.what)+'</span></div>').join(''):'')+'<div style="margin-top:6px;color:#fde68a">'+esc(n.zeroPoint.gap)+'</div></div>':'')+
  (n.hinge&&!n.hingeNote?'<div class="sm dim" style="margin-bottom:8px">Part of the confessional hinge in the Temple: a way confession can be returned to the people it came from.</div>':'')+
  (n.builders?'<div class="sm" style="border-left:3px solid #38bdf8;padding:4px 0 4px 9px;margin-bottom:10px"><b style="color:#38bdf8">Builders carrying this into AI</b>'+n.builders.map(b=>'<div style="margin-top:4px">'+link(b.id)+'<br><span class="dim">'+esc(b.desc)+'</span></div>').join('')+'</div>':'')+
  (n.orbit?'<div class="sm dim" style="margin-bottom:8px">Placed in orbit around '+esc(n.orbit)+' '+esc(n.orbitWhy||'')+'. Its measured links are too thin to make it a member.</div>':'')+
  (n.rhyme?'<div class="sm" style="border-left:3px solid #f43f5e;padding:4px 0 4px 9px;margin-bottom:10px"><b style="color:#fda4af">Rhymes with the extraction systems map.</b> '+esc(n.rhyme)+(n.rgroup?'<br><span class="dim">Rhyme group: '+esc(n.rgroup)+'. Red dotted lines link it to the rest of that group.</span>':'')+'</div>':'')+
  (n.covers&&n.covers.length?'<div class="sm" style="margin-bottom:10px"><b>Also covers</b> (folded in for precision): '+n.covers.map(c=>esc(c.term)+' <span class="dim">'+(c.total==null?'?':c.total.toLocaleString())+' repos</span>').join(' &middot; ')+'</div>':'')+
  (n.pairs&&n.pairs.length?'<div class="sm" style="border-left:3px solid #7dd3fc;padding:4px 0 4px 9px;margin-bottom:10px"><b style="color:#7dd3fc">'+(n.sysTerm||n.pairs.some(p=>p.systems)?'Systems translation':'Translated by the Loom')+'</b>'+n.pairs.map(p=>'<div style="margin-top:4px">'+(p.systems?esc(n.term)+' &rarr; '+esc(p.with):esc(p.with)+' &rarr; '+esc(n.term))+' <span class="dim">('+(p.source==='rosetta'?'rosetta pairing':'proposed pairing')+')</span><br><span class="dim">'+esc(p.note)+'</span></div>').join('')+'</div>':'')+
  (n.case?'<details class="sm" style="border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:10px"><summary style="cursor:pointer;color:var(--dim)">'+esc(n.case.title)+'</summary><div style="margin:6px 0">'+esc(n.case.note)+'</div><ul style="margin:0 0 6px 16px">'+n.case.facts.map(f=>'<li style="margin-bottom:3px">'+esc(f)+'</li>').join('')+'</ul>'+
    (n.case.github?'<div style="margin-top:6px">Related tools on GitHub:<br>'+Object.entries(n.case.github).map(([k,v])=>esc(k)+': <b>'+(v.total==null?'?':v.total.toLocaleString())+'</b> repos'+(v.top.length?' (e.g. '+v.top.slice(0,2).map(r=>link(r.id,esc(r.id.split('/')[1]))).join(', ')+')':'')).join('<br>')+'</div>':'')+
    '<div class="dim" style="margin-top:6px;font-style:italic">'+esc(n.case.caveat)+'</div></details>':'')+
  (n.mine?'<div class="sm" style="color:#ffd166;margin-bottom:6px">Coined term. Its gold dotted links are declared connections, not measured co-occurrence.'+(n.ghTotal?' GitHub search finds '+n.ghTotal+' repos using the phrase.':' Nobody else on GitHub uses the phrase yet.')+'</div>':'')+
  (n.new&&!n.mine?'<div class="sm" style="margin-bottom:6px">&#10022; <b>New word.</b> GitHub search: <b>'+(n.ghTotal==null?'?':n.ghTotal.toLocaleString())+'</b> repos'+(n.recentShare!=null?', <b>'+Math.round(n.recentShare*100)+'%</b> created since Jan 2025':'')+(DATA.base&&DATA.base.share?' <span class="dim">(all of GitHub: '+Math.round(DATA.base.share*100)+'%)</span>':'')+'. Touches <b>'+(n.converge||0)+'</b> constellation'+(n.converge===1?'':'s')+'.</div>':'')+
  (!n.new?'<div class="sm dim">Used in <b style="color:var(--ink)">'+n.nRepos+'</b> repos</div>':'')+
  '<div class="h3">Resonates with ('+L.length+')</div>'+(L.length?L.map(x=>{ const o=DATA.nodes[x.o]; const other=o.c!==n.c;
    return '<div class="rrow"><span class="bar" style="width:'+Math.max(6,Math.round(110*x.e.s/maxS))+'px;background:'+(x.e.trans?'#7dd3fc':x.e.rhyme?'#f43f5e':x.e.declared?'#ffd166':TIER[o.tier].color)+'"></span><span class="lnk" data-i="'+x.o+'">'+esc(o.term)+'</span>'+(other?' <span class="tag">in '+esc(CONS[o.c].name)+'</span>':'')+'<br><span class="dim sm">'+(x.e.trans?'translation ('+(x.e.source==='rosetta'?'rosetta pairing':'proposed')+'), not measured':x.e.rhyme?'rhyme line: same move ('+esc(x.e.group||'')+'), not measured':x.e.declared?(x.e.note?'stated connection ('+esc(x.e.source)+'): '+esc(x.e.note):'a declared connection'):x.e.k+' shared repos &middot; '+x.e.lift+'&times; chance &middot; '+x.e.shared.slice(0,3).map(r=>link(r,esc(r.split('/')[1]))).join(', '))+'</span></div>'; }).join(''):'<div class="dim sm">Nothing turns up with it more often than chance would predict.</div>')+
  (n.examples.length?'<div class="h3">Example repos</div>'+n.examples.map(r=>{ const m=DATA.meta[r]||{}; return '<div style="margin-bottom:6px">'+link(r)+(m.onMap?' <span class="tag">on the star map</span>':'')+'<br><span class="sm dim">'+esc(m.desc||'')+'</span></div>'; }).join(''):'')+
  '';
  $('back').onclick=()=>openCon(n.c);
  document.querySelectorAll('#detail .lnk[data-i]').forEach(a=>a.onclick=()=>{ const j=+a.dataset.i; state.sel=j; showTerm(j); applyFocus(); });
}
$('q').oninput=e=>{ state.q=e.target.value.trim().toLowerCase(); applyFocus(); const hit=DATA.nodes.findIndex(n=>vis(n)&&state.q&&n.term.startsWith(state.q)); if(hit>=0){ state.sel=hit; showTerm(hit); applyFocus(); } };
$('lines').onchange=e=>{ state.lines=e.target.value; applyFocus(); };
function showNewList(){
  state.con=null; applyFocus();
  const ex=DATA.nodes.map((n,i)=>[n,i]).filter(([n])=>n.rhyme&&!n.mine);
  const nw=DATA.nodes.map((n,i)=>[n,i]).filter(([n])=>n.new&&!n.mine&&!n.rhyme).sort((a,b)=>(b[0].converge||0)-(a[0].converge||0)||(b[0].recentShare||0)-(a[0].recentShare||0));
  const mine=DATA.nodes.map((n,i)=>[n,i]).filter(([n])=>n.mine);
  const row=([n,i])=>'<div style="margin-bottom:7px"><span class="lnk" data-i="'+i+'">'+(n.mine?'':'&#10022; ')+esc(n.term)+'</span> '+tierTag(n.tier)+'<br><span class="sm dim">'+esc(CONS[n.c].name)+(n.mine?'':' &middot; '+(n.ghTotal==null?'?':n.ghTotal.toLocaleString())+' repos'+(n.recentShare!=null?' &middot; '+Math.round(n.recentShare*100)+'% since 2025':'')+' &middot; touches '+(n.converge||0))+'</span></div>';
  $('detail').innerHTML='<div class="h3" style="margin-top:0;color:#fda4af">Rhymes with extraction systems ('+ex.length+')</div>'+ex.map(([n,i])=>'<div style="margin-bottom:7px"><span class="lnk" data-i="'+i+'">&#10022; '+esc(n.term)+'</span> '+tierTag(n.tier)+'<br><span class="sm dim">'+esc((n.rhyme||'').split(':')[0])+' &middot; '+esc(CONS[n.c].name)+' &middot; '+(n.ghTotal==null?'?':n.ghTotal.toLocaleString())+' repos</span></div>').join('')+'<div class="h3">Other new words ('+nw.length+'), most converging first</div><div class="sm dim" style="margin-bottom:8px">&ldquo;Touches&rdquo; = how many constellations its measured links reach. Higher means the word sits where vocabularies meet.</div>'+nw.map(row).join('')+
    (mine.length?'<div class="h3">Coined terms ('+mine.length+')</div>'+mine.map(row).join(''):'');
  document.querySelectorAll('#detail .lnk[data-i]').forEach(a=>a.onclick=()=>{ const j=+a.dataset.i; state.sel=j; showTerm(j); applyFocus(); const m=DATA.nodes[j]; zoomBox({x:m.x-420,y:m.y-300,w:840,h:600}); });
}
$('listNew').onclick=showNewList;
$('howRead').onclick=()=>{ state.sel=null; showList(); const d=document.querySelector('#detail .readcard'); if(d){ d.open=true; $('detail').scrollTop=0; } };

$('tNew').onclick=()=>{ state.showNew=!state.showNew; $('tNew').classList.toggle('off',!state.showNew); render(); };
if(!DATA.nodes.some(n=>n.mine)) $('tMine').style.display='none';
$('tMine').onclick=()=>{ state.showMine=!state.showMine; $('tMine').classList.toggle('off',!state.showMine); render(); };
$('showList').onclick=()=>{ state.sel=null; showList(); fit(); };
const ZMIN=.06, ZMAX=2.5;
function zoomAt(factor,cx,cy){ const r=svg.getBoundingClientRect(); if(!r.width) return; legendShow(false); if(home.w<=1) fit(); if(cx==null){cx=r.width/2; cy=r.height/2;}
  const mx=vb.x+cx/r.width*vb.w, my=vb.y+cy/r.height*vb.h;
  const nw=Math.min(home.w*ZMAX,Math.max(home.w*ZMIN,vb.w*factor)); const k=nw/vb.w;
  vb.x=mx-(mx-vb.x)*k; vb.y=my-(my-vb.y)*k; vb.w=nw; vb.h*=k; setVB(); }
$('stage').addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect();
  let dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?r.height:1); dy=Math.max(-120,Math.min(120,dy));
  zoomAt(Math.exp(dy*(e.ctrlKey?0.01:0.0025)),e.clientX-r.left,e.clientY-r.top); },{passive:false});
let gScale=1;
svg.addEventListener('gesturestart',e=>{ e.preventDefault(); gScale=1; });
svg.addEventListener('gesturechange',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(gScale/e.scale,e.clientX-r.left,e.clientY-r.top); gScale=e.scale; });
svg.addEventListener('gestureend',e=>e.preventDefault());
let drag=null, tState=null;
svg.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; });
window.addEventListener('mouseup',()=>drag=null);
// a constellation's subtitle shows only while the pointer is over it (its stars sit on a higher layer, so this follows the pointer, not CSS :hover)
let hovCon=null;
let hovPend=null;
svg.addEventListener('mousemove',e=>{ if(drag) return; const first=!hovPend; hovPend={x:e.clientX,y:e.clientY}; if(first) requestAnimationFrame(hovCheck); });   // at most once per frame
function hovCheck(){ const e={clientX:hovPend.x,clientY:hovPend.y}; hovPend=null; if(drag) return; const m=svg.getScreenCTM(); if(!m) return; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  let hit=null; ELC.forEach(o=>{ const c=CONS[o.ci], [cx,cy]=c.center, r=c.radius; if(Math.hypot(p.x-cx,p.y-cy)<r*1.08||(Math.abs(p.x-cx)<Math.max(r,c.name.length*26)&&p.y>cy-r-130&&p.y<cy-r)) hit=o; });
  if(hit!==hovCon){ if(hovCon) hovCon.g.classList.remove('hov'); hovCon=hit; if(hit) hit.g.classList.add('hov'); } }
svg.addEventListener('mouseleave',()=>{ if(hovCon) hovCon.g.classList.remove('hov'); hovCon=null; });
window.addEventListener('mousemove',e=>{ if(!drag) return; if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4) legendShow(false); const r=svg.getBoundingClientRect(); vb.x=drag.vx-(e.clientX-drag.x)*vb.w/r.width; vb.y=drag.vy-(e.clientY-drag.y)*vb.h/r.height; setVB(); });
svg.addEventListener('touchstart',e=>{ const t=e.touches; if(t.length===2) tState={d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}; else if(t.length===1) tState={x:t[0].clientX,y:t[0].clientY,vx:vb.x,vy:vb.y}; },{passive:true});
svg.addEventListener('touchmove',e=>{ if(!tState) return; e.preventDefault(); const t=e.touches, r=svg.getBoundingClientRect();
  if(t.length===2&&tState.d){ const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); zoomAt(tState.d/d,(t[0].clientX+t[1].clientX)/2-r.left,(t[0].clientY+t[1].clientY)/2-r.top); tState.d=d; }
  else if(t.length===1&&tState.x!=null){ vb.x=tState.vx-(t[0].clientX-tState.x)*vb.w/r.width; vb.y=tState.vy-(t[0].clientY-tState.y)*vb.h/r.height; setVB(); } },{passive:false});
svg.addEventListener('touchend',()=>tState=null);
$('zin').onclick=()=>zoomAt(1/1.4); $('zout').onclick=()=>zoomAt(1.4); $('zfit').onclick=()=>{ state.con=null; applyFocus(); fit(); };
svg.addEventListener('dblclick',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.shiftKey?2:0.5, e.clientX-r.left, e.clientY-r.top); });  // double-click zooms in at the cursor; shift zooms out
svg.addEventListener('click',e=>{ if(e.target===svg){ state.sel=null; state.selB=null; showList(); } });
window.addEventListener('keydown',e=>{ if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='+'||e.key==='=') zoomAt(1/1.25); else if(e.key==='-'||e.key==='_') zoomAt(1.25); else if(e.key==='0'){ state.con=null; applyFocus(); fit(); } });
window.addEventListener('resize',()=>{ if(home.w<=1){ fit(); return; } const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return; const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2, w=vb.w, h=w*r.height/r.width; vb={x:cx-w/2,y:cy-h/2,w,h}; setVB(); });  // keep your zoom and centre when the window changes size
fit(); render(); showList();
if(home.w<=1) requestAnimationFrame(fit);  // page had no size yet on first fit (e.g. opened in a background tab)
window.addEventListener('load',()=>{ if(home.w<=1) fit(); });
})();
</script>
